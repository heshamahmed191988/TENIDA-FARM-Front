# CI/CD — Tenida Farm web app (Angular) → Netlify
#
#  push to master  → build (production) → deploy to Netlify
#  pull request    → build only
#  manual run      → Actions tab → "Deploy Web" → Run workflow
#
# The app calls the API at the relative path /api. Netlify proxies /api/* to the backend
# (server-to-server), so the browser stays on HTTPS even though the free API host is HTTP-only,
# and no CORS is needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   NETLIFY_AUTH_TOKEN   Netlify → User settings → Applications → Personal access tokens
#   NETLIFY_SITE_ID      Netlify → Site configuration → Site details → Site ID
# Repository variable (… → Variables):
#   API_ORIGIN           backend origin without /api, e.g. http://tendafarm.runasp.net

name: Deploy Web

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Add API proxy rule
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          OUT=dist/tenida-farm/browser/_redirects
          if [ -n "$API_ORIGIN" ]; then
            ORIGIN="${API_ORIGIN%/}"
            # Proxy rule must come before the SPA fallback (first match wins).
            { echo "/api/*  ${ORIGIN}/api/:splat  200"; cat "$OUT"; } > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
          else
            echo "::warning::API_ORIGIN variable not set — /api will not reach the backend."
          fi
          cat "$OUT"

      - name: Deploy to Netlify
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MSG: ${{ github.sha }} ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Deploy skipped — add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets (see deploy-web.yml header)."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir dist/tenida-farm/browser \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "$DEPLOY_MSG"
