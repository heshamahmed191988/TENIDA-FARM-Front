# CI/CD — Tenida Farm web app (Angular) → Netlify
#
#  push to master  → build (production) → deploy to Netlify
#  pull request    → build only
#  manual run      → Actions tab → "Deploy Web" → Run workflow
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   NETLIFY_AUTH_TOKEN   Netlify → User settings → Applications → Personal access tokens
#   NETLIFY_SITE_ID      Netlify → Site configuration → Site details → Site ID
# Repository variable (… → Variables):
#   API_URL              the deployed API base URL, e.g. https://tenida-api.runasp.net/api

name: Deploy Web

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Point the production build at the API
        if: vars.API_URL != ''
        run: |
          sed -i "s#apiUrl: '/api'#apiUrl: '${{ vars.API_URL }}'#" src/environments/environment.prod.ts
          grep apiUrl src/environments/environment.prod.ts

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Deploy to Netlify
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MSG: ${{ github.sha }} ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Deploy skipped — add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets (see deploy-web.yml header)."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir dist/tenida-farm/browser \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "$DEPLOY_MSG"
